<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyfera's Art – Digital Illustration Portfolio</title>
    <meta name="description" content="Portofolio ilustrasi digital Lyfera: karya karakter, fanart, dan ilustrasi bertema klasik.">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Pinyon+Script&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" loop preload="none">
        <source src="https://www.chosic.com/wp-content/uploads/2021/07/Rainy-Day-Ambient-Music.mp3" type="audio/mpeg">
    </audio>
    <audio id="flipSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- TAMPILAN LAPTOP / DESKTOP: buku flip -->
    <main class="desktop-view">
        <div class="container" id="stage">
            <img src="quillpen.png" class="quill-pen" alt="" onerror="this.remove()">
            <div class="flip-book" id="flipBook"></div>
        </div>
        <div class="toolbar" id="toolbar"></div>
    </main>

    <!-- TAMPILAN HP: scroll biasa -->
    <main class="mobile-view" id="scrollView"></main>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="script.js"></script>
</body>
</html>
